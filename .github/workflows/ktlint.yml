name: 코드 스타일 검사

on:
  # 브랜치 필터 없이 모든 브랜치·태그의 push에서 실행한다.
  push:

# 같은 브랜치에서 새 커밋이 올라오면 진행 중인 이전 실행은 취소한다.
concurrency:
  group: ktlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ktlint:
    name: Code style check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --continue
