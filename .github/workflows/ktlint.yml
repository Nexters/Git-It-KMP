name: 코드 스타일 검사

on:
  # main으로 향하는 PR과 main에 들어오는 push에서 실행한다.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# 같은 브랜치에서 새 커밋이 올라오면 진행 중인 이전 실행은 취소한다.
concurrency:
  group: ktlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ktlint:
    name: Code style check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --continue
